# Runs on the EC2 box; .github/workflows/ci-cd.yml copies this file and backend.env next to it.
services:
  backend:
    image: ${IMAGE}:backend-${TAG}
    env_file: backend.env
    environment:
      PORT: 8000
    volumes:
      - data:/data   # SQLite lives here when DATABASE_URL isn't set, so it survives redeploys
    restart: unless-stopped

  frontend:
    image: ${IMAGE}:frontend-${TAG}
    depends_on: [backend]
    restart: unless-stopped

  # TLS in front of everything: Let's Encrypt cert for DOMAIN, auto-renewed, and HTTP -> HTTPS redirect
  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${DOMAIN} --to frontend:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data   # certificates; keeping them across redeploys avoids Let's Encrypt rate limits
    depends_on: [frontend]
    restart: unless-stopped

volumes:
  data:
  caddy:
