services:
  - type: web
    name: disha-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false  # set to your Neon connection string after creating the project
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: HTTPS
        value: "true"
      - key: TZ
        value: Asia/Kolkata
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_COLLECTION
        value: disha_policies

  - type: web
    name: disha-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: API_URL
        sync: false  # set after first deploy to disha-backend's URL, e.g. https://disha-backend.onrender.com
